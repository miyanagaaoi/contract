name: CI

# 质量门禁（CR-033）：后端测试 + 前端构建 + 静态守卫
# 触发：push / PR / 手动；任何一步失败即红灯，防止“build 过但运行白屏”类问题合入。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-pg.txt pytest httpx
      - name: Ruff (未定义名称/语法错误)
        run: |
          pip install ruff
          ruff check app
      - name: Pytest (含前端静态守卫)
        run: python -m pytest app/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install & build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          node node_modules/vite/bin/vite.js build

  smoke:
    name: Served app smoke (health/version)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-pg.txt
      - name: Start uvicorn (sqlite temp)
        run: |
          export CTMS_DB_URL="sqlite:////tmp/ctms-ci.db"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/ctms.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python - <<'PY'
          import json, pathlib, re
          health = json.loads(pathlib.Path("/tmp/health.json").read_text())
          version = re.search(r'APP_VERSION = "([^"]+)"', pathlib.Path("app/config.py").read_text()).group(1)
          assert health["status"] == "ok", health
          assert health["version"] == version, (health["version"], version)
          assert health["db"] is True
          print("smoke ok:", health["version"])
          PY
      - name: Show server log on failure
        if: failure()
        run: tail -50 /tmp/ctms.log
