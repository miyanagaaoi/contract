<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTMS V2.0 前端页面布局线框（ERP 进销存）</title>
<style>
  :root{
    --pri:#409eff; --suc:#67c23a; --wrn:#e6a23c; --dgr:#f56c6c; --info:#909399;
    --txt:#303133; --txt2:#606266; --txt3:#909399;
    --bd:#dcdfe6; --bd2:#e4e7ed; --bd3:#ebeef5; --bg:#f5f7fa;
    --side:#1f2d3d; --side2:#263445; --side-txt:#c0c4cc;
    --r:4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#eef1f6; color:var(--txt); font-size:13px;
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  }
  code{font-family:Consolas,"Courier New",monospace;}

  /* ================= 外层：预览器骨架 ================= */
  .top{
    background:linear-gradient(135deg,#1f2d3d,#33475b); color:#fff;
    padding:18px 24px;
  }
  .top h1{margin:0 0 4px; font-size:18px; letter-spacing:.5px;}
  .top p{margin:0; font-size:12.5px; color:#c0c9d4;}
  .top .badge{
    display:inline-block; margin-left:8px; padding:1px 8px; border-radius:10px; font-size:11.5px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  }
  .app{display:flex; gap:16px; padding:16px 24px 40px; align-items:flex-start;}
  .cat{
    flex:0 0 232px; position:sticky; top:16px; background:#fff; border:1px solid var(--bd2);
    border-radius:6px; padding:10px; max-height:calc(100vh - 32px); overflow:auto;
  }
  .cat h3{
    margin:10px 6px 6px; font-size:11.5px; color:var(--txt3); font-weight:600; letter-spacing:.6px;
  }
  .cat h3:first-child{margin-top:2px;}
  .cat a{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:var(--r);
    color:var(--txt2); text-decoration:none; font-size:12.5px; cursor:pointer;
  }
  .cat a:hover{background:#f5f7fa;}
  .cat a.on{background:#ecf5ff; color:var(--pri); font-weight:600;}
  .cat a .n{color:var(--txt3); font-size:11px; font-family:Consolas,monospace;}
  .cat a.on .n{color:var(--pri);}

  .stage{flex:1 1 auto; min-width:0;}
  .stage-hd{
    background:#fff; border:1px solid var(--bd2); border-radius:6px; padding:14px 18px; margin-bottom:12px;
  }
  .stage-hd .row1{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .stage-hd h2{margin:0; font-size:15.5px;}
  .stage-hd .path{font-family:Consolas,monospace; font-size:12.5px; color:var(--pri); background:#ecf5ff; padding:2px 8px; border-radius:var(--r);}
  .stage-hd .perm{font-family:Consolas,monospace; font-size:11.5px; color:var(--txt3);}
  .stage-hd ul{margin:10px 0 0; padding-left:18px; color:var(--txt2); font-size:12.5px; line-height:1.75;}
  .stage-hd ul b{color:var(--txt);}

  .holder{position:relative; width:100%;}
  .frame{
    position:absolute; top:0; left:0; width:1440px; transform-origin:top left;
    background:#fff; border:1px solid #d9dee6; border-radius:6px; overflow:hidden;
    box-shadow:0 8px 26px rgba(31,45,61,.10);
  }

  /* ================= 线框内部：外壳 ================= */
  .wf{display:flex; min-height:900px; background:var(--bg);}
  .wf-side{
    flex:0 0 220px; background:var(--side); color:var(--side-txt); padding-bottom:20px;
  }
  .wf-brand{
    height:56px; display:flex; align-items:center; gap:9px; padding:0 16px;
    color:#fff; font-size:14px; font-weight:600; letter-spacing:.5px; border-bottom:1px solid #2b3a4d;
  }
  .wf-brand .logo{width:20px;height:20px;border-radius:4px;background:var(--pri);}
  .wf-menu{padding:8px 0;}
  .wf-mi{
    height:40px; display:flex; align-items:center; gap:9px; padding:0 16px; font-size:13px;
    border-left:3px solid transparent;
  }
  .wf-mi .ico{width:13px;height:13px;border-radius:3px;background:#4a5a6d;flex:0 0 auto;}
  .wf-mi .arw{margin-left:auto; font-size:10px; color:#7d8794;}
  .wf-mi.sub{height:34px; padding-left:38px; font-size:12.5px; color:#a9b3c0;}
  .wf-mi.sub .ico{width:9px;height:9px;background:#54637a;border-radius:2px;}
  .wf-mi.sub2{height:32px; padding-left:54px; font-size:12.5px; color:#98a2af;}
  .wf-mi.sub2 .ico{width:8px;height:8px;background:#54637a;border-radius:2px;}
  .wf-mi.on{background:var(--side2); color:#fff; border-left-color:var(--pri); font-weight:600;}
  .wf-mi.on .ico{background:var(--pri);}

  .wf-body{flex:1 1 auto; display:flex; flex-direction:column; min-width:0;}
  .wf-top{
    height:56px; background:#fff; border-bottom:1px solid var(--bd2);
    display:flex; align-items:center; padding:0 20px; gap:14px;
  }
  .wf-crumb{font-size:12.5px; color:var(--txt3);}
  .wf-crumb b{color:var(--txt2); font-weight:400;}
  .wf-top .sp{flex:1 1 auto;}
  .wf-user{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--txt2);}
  .wf-avatar{width:26px;height:26px;border-radius:50%;background:#ecf5ff;border:1px solid #d9ecff;
             display:flex;align-items:center;justify-content:center;color:var(--pri);font-size:11px;}
  .wf-main{flex:1 1 auto; padding:16px;}

  /* ================= 线框组件 ================= */
  .card{
    background:#fff; border:1px solid var(--bd2); border-radius:var(--r); padding:16px; margin-bottom:12px;
  }
  .card.tight{padding:0; overflow:hidden;}
  .card-hd{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .card.tight .card-hd{margin:0; padding:12px 16px; border-bottom:1px solid var(--bd3);}
  .card-hd .t{font-size:13.5px; font-weight:600;}
  .card-hd .sp{flex:1 1 auto;}
  .card-hd .sub{font-size:12px; color:var(--txt3);}

  .btn{
    display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 14px; border-radius:var(--r);
    border:1px solid var(--bd); background:#fff; color:var(--txt2); font-size:12.5px; white-space:nowrap;
  }
  .btn.pri{background:var(--pri); border-color:var(--pri); color:#fff;}
  .btn.suc{background:var(--suc); border-color:var(--suc); color:#fff;}
  .btn.wrn{background:var(--wrn); border-color:var(--wrn); color:#fff;}
  .btn.dgr{background:var(--dgr); border-color:var(--dgr); color:#fff;}
  .btn.sm{height:26px; padding:0 10px; font-size:12px;}
  .btn.text{border-color:transparent; background:transparent; color:var(--pri); padding:0 6px;}
  .btn.text.dgr{color:var(--dgr);}

  .inp, .sel{
    display:inline-flex; align-items:center; height:32px; padding:0 10px; border-radius:var(--r);
    border:1px solid var(--bd); background:#fff; color:var(--txt3); font-size:12.5px;
  }
  .inp.ph{color:#c0c4cc;}
  .sel .arw{margin-left:auto; font-size:10px; color:#c0c4cc; padding-left:10px;}
  .field{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .field>label{width:88px; text-align:right; color:var(--txt2); font-size:12.5px; flex:0 0 auto;}
  .field>label.req::before{content:"*"; color:var(--dgr); margin-right:3px;}
  .field .ctl{flex:1 1 auto; min-width:0;}
  .field .ctl .inp, .field .ctl .sel{width:100%;}
  .form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 24px;}
  .form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .form-grid .field>label{width:82px;}

  .filter{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;}
  .filter .f{display:flex; align-items:center; gap:7px;}
  .filter .f>label{color:var(--txt2); font-size:12.5px; white-space:nowrap;}
  .filter .sp{flex:1 1 auto;}

  table.wf-tb{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.wf-tb th{
    background:#f5f7fa; color:var(--txt2); font-weight:600; text-align:left;
    padding:9px 12px; border-bottom:1px solid var(--bd3); white-space:nowrap;
  }
  table.wf-tb td{
    padding:9px 12px; border-bottom:1px solid var(--bd3); color:var(--txt2); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  table.wf-tb tr:nth-child(even) td{background:#fafbfc;}
  table.wf-tb .num{text-align:right; font-family:Consolas,monospace;}
  table.wf-tb .c{text-align:center;}
  table.wf-tb .mono{font-family:Consolas,monospace; color:var(--txt);}

  .tag{
    display:inline-block; height:22px; line-height:20px; padding:0 8px; border-radius:3px; font-size:11.5px;
    background:#f4f4f5; border:1px solid #e9e9eb; color:#909399;
  }
  .tag.pri{background:#ecf5ff; border-color:#d9ecff; color:var(--pri);}
  .tag.suc{background:#f0f9eb; border-color:#e1f3d8; color:var(--suc);}
  .tag.wrn{background:#fdf6ec; border-color:#faecd8; color:var(--wrn);}
  .tag.dgr{background:#fef0f0; border-color:#fde2e2; color:var(--dgr);}
  .tag.gray{background:#f4f4f5; border-color:#e9e9eb; color:#909399;}

  .pager{display:flex; align-items:center; gap:8px; padding:12px 16px; font-size:12.5px; color:var(--txt2);}
  .pager .sp{flex:1 1 auto;}
  .pager .pg{
    display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:28px;
    padding:0 8px; border:1px solid var(--bd); border-radius:var(--r); background:#fff; color:var(--txt2);
  }
  .pager .pg.on{background:var(--pri); border-color:var(--pri); color:#fff;}

  .stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:12px;}
  .stat{background:#fff; border:1px solid var(--bd2); border-radius:var(--r); padding:14px 16px;}
  .stat .k{font-size:12.5px; color:var(--txt3);}
  .stat .v{font-size:24px; font-weight:700; margin:4px 0 2px; letter-spacing:.5px;}
  .stat .d{font-size:11.5px; color:var(--txt3);}
  .stat.pri .v{color:var(--pri);} .stat.wrn .v{color:var(--wrn);}
  .stat.dgr .v{color:var(--dgr);} .stat.suc .v{color:var(--suc);}

  .cols{display:grid; gap:12px;}
  .cols.c2{grid-template-columns:1fr 1fr;}
  .cols.c2w{grid-template-columns:1.4fr 1fr;}
  .cols.side{grid-template-columns:280px 1fr;}
  .cols.side2{grid-template-columns:300px 1fr;}

  .tree{padding:4px 0; font-size:12.5px; color:var(--txt2);}
  .tree .tn{display:flex; align-items:center; gap:6px; height:30px; padding:0 8px; border-radius:var(--r);}
  .tree .tn.on{background:#ecf5ff; color:var(--pri); font-weight:600;}
  .tree .tn.l2{padding-left:24px;}
  .tree .tn.l3{padding-left:40px;}
  .tree .tri{font-size:9px; color:var(--txt3); width:10px;}

  .tabs{display:flex; gap:0; border-bottom:1px solid var(--bd2); margin-bottom:14px; flex-wrap:wrap;}
  .tabs .tb{
    padding:9px 16px; font-size:13px; color:var(--txt2); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabs .tb.on{color:var(--pri); border-bottom-color:var(--pri); font-weight:600;}
  .tabs.mini .tb{padding:7px 12px; font-size:12.5px;}

  .tl{position:relative; padding-left:18px;}
  .tl::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--bd2);}
  .tl .it{position:relative; padding-bottom:14px;}
  .tl .it::before{
    content:""; position:absolute; left:-16px; top:5px; width:7px; height:7px; border-radius:50%;
    background:#fff; border:2px solid var(--pri);
  }
  .tl .it .h{font-size:12.5px; color:var(--txt);}
  .tl .it .m{font-size:11.5px; color:var(--txt3); margin-top:2px;}

  .kv{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 24px; font-size:12.5px;}
  .kv.c3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .kv .i{display:flex; gap:8px;}
  .kv .i .k{color:var(--txt3); flex:0 0 84px; text-align:right;}
  .kv .i .v{color:var(--txt);}

  .ph{background:#fafbfc; border:1px dashed #dfe4ea; border-radius:var(--r); color:#b4bcc6; font-size:12px;
      display:flex; align-items:center; justify-content:center;}

  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .toolbar .sp{flex:1 1 auto;}
  .toolbar .cnt{font-size:12.5px; color:var(--txt3);}
  .toolbar .cnt b{color:var(--pri); font-weight:600;}

  .actionbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff;
    border-top:1px solid var(--bd2); position:sticky; bottom:0;
  }
  .actionbar .sp{flex:1 1 auto;}

  .mask{
    position:absolute; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-start;
    justify-content:center; padding-top:120px;
  }
  .dialog{width:560px; background:#fff; border-radius:6px; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.2);}
  .dialog .dh{padding:14px 18px; font-size:14px; font-weight:600; border-bottom:1px solid var(--bd3);}
  .dialog .db{padding:18px;}
  .dialog .df{padding:12px 18px; border-top:1px solid var(--bd3); display:flex; justify-content:flex-end; gap:10px;}

  .drawer{
    position:absolute; top:0; right:0; bottom:0; width:520px; background:#fff;
    border-left:1px solid var(--bd2); box-shadow:-8px 0 24px rgba(31,45,61,.10);
  }
  .drawer .dh{padding:14px 18px; font-size:14px; font-weight:600; border-bottom:1px solid var(--bd3);
              display:flex; align-items:center;}
  .drawer .dh .sp{flex:1 1 auto;}
  .drawer .db{padding:14px 18px;}

  .perm-tree{border:1px solid var(--bd3); border-radius:var(--r); padding:12px 14px; max-height:300px; overflow:auto;}
  .perm-grp{margin-bottom:10px;}
  .perm-grp .gt{font-size:12.5px; font-weight:600; color:var(--txt); margin-bottom:6px; display:flex; align-items:center; gap:7px;}
  .perm-grp .items{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px 12px; padding-left:22px;}
  .perm-grp .items .it{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--txt2);}
  .cbx{width:13px; height:13px; border:1px solid var(--bd); border-radius:2px; background:#fff; flex:0 0 auto;}
  .cbx.on{background:var(--pri); border-color:var(--pri); position:relative;}
  .cbx.on::after{content:"✓"; color:#fff; font-size:10px; position:absolute; top:-3px; left:1px;}
  .cbx.half{background:var(--pri); border-color:var(--pri); position:relative;}
  .cbx.half::after{content:""; position:absolute; left:2px; right:2px; top:5px; height:2px; background:#fff;}

  /* 独立页（无侧栏） */
  .solo{min-height:900px; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(135deg,#1f2d3d,#33475b);}
  .solo .box{width:400px; background:#fff; border-radius:8px; padding:32px 34px; box-shadow:0 18px 40px rgba(0,0,0,.25);}
  .solo .box .lg{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .solo .box .lg .logo{width:26px;height:26px;border-radius:6px;background:var(--pri);}
  .solo .box h2{margin:0; font-size:17px;}
  .solo .box .sub{color:var(--txt3); font-size:12.5px; margin:0 0 22px;}
  .solo .box .inp{width:100%; margin-bottom:12px; height:38px;}
  .solo .box .btn.full{width:100%; height:38px; justify-content:center; margin-top:8px; font-size:13.5px;}
  .solo .box .foot{margin-top:16px; font-size:11.5px; color:var(--txt3); text-align:center;}
  .solo .err{justify-content:center; align-items:center;}
  .solo .err .code{font-size:64px; font-weight:800; color:#5a6b7d; line-height:1; letter-spacing:4px;}
  .solo .err .msg{font-size:14px; margin:14px 0 4px;}
  .solo .err .det{font-size:12.5px; color:#8b96a3; margin-bottom:20px;}

  /* 规范页 */
  .spec-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
  .spec{background:#fff; border:1px solid var(--bd2); border-radius:var(--r); padding:14px 16px;}
  .spec h4{margin:0 0 10px; font-size:13px;}
  .spec dl{margin:0; font-size:12.5px; color:var(--txt2);}
  .spec dl div{display:flex; gap:8px; padding:3px 0; border-bottom:1px dashed #f0f2f5;}
  .spec dl div:last-child{border-bottom:0;}
  .spec dt{flex:0 0 108px; color:var(--txt3); font-family:Consolas,monospace; font-size:12px;}
  .spec dd{margin:0;}
  .sw-row{display:flex; gap:6px; flex-wrap:wrap;}
  .sw{width:52px; height:34px; border-radius:var(--r); display:flex; align-items:flex-end; justify-content:center;
      font-size:9.5px; color:#fff; padding-bottom:3px;}
</style>
</head>
<body>

<div class="top">
  <h1>CTMS V2.0 前端页面布局线框 <span class="badge">ERP 进销存 · 静态示意</span></h1>
  <p>依据 <code>12-erp-system-design.md</code> §7 前端设计绘制：只表达结构、层级与尺寸，不含任何交互与真实数据。所有页面按 1440px 视口等比缩放。</p>
</div>

<div class="app">
  <nav class="cat" id="cat"></nav>
  <div class="stage">
    <div class="stage-hd">
      <div class="row1">
        <h2 id="pg-name">—</h2>
        <span class="path" id="pg-path">—</span>
        <span class="perm" id="pg-perm"></span>
      </div>
      <ul id="pg-tips"></ul>
    </div>
    <div class="holder" id="holder"><div class="frame" id="frame"></div></div>
  </div>
</div>

<script>
/* =======================================================================
   线框基础件
   ======================================================================= */
const inp  = (t, w) => `<span class="inp ph"${w?` style="width:${w}px"`:''}>${t}</span>`;
const inpV = (t, w) => `<span class="inp"${w?` style="width:${w}px"`:''}>${t}</span>`;
const sel  = (t, w) => `<span class="sel"${w?` style="width:${w}px"`:''}>${t}<span class="arw">▾</span></span>`;
const btn  = (t, type='', cls='') => `<span class="btn ${type} ${cls}">${t}</span>`;
const tag  = (t, type='gray') => `<span class="tag ${type}">${t}</span>`;
const field= (label, ctl, req) => `<div class="field"><label class="${req?'req':''}">${label}</label><div class="ctl">${ctl}</div></div>`;
const fitem= (label, ctl) => `<div class="f"><label>${label}</label>${ctl}</div>`;

function table(cols, rows, cls=''){
  const cg = cols.map(c=>`<col${c.w?` style="width:${c.w}"`:''}>`).join('');
  const th = cols.map(c=>`<th${c.cls?` class="${c.cls}"`:''}>${c.t}</th>`).join('');
  const tb = rows.map(r=>`<tr>${r.map((c,i)=>`<td${cols[i].cls?` class="${cols[i].cls}"`:''}>${c}</td>`).join('')}</tr>`).join('');
  return `<table class="wf-tb ${cls}"><colgroup>${cg}</colgroup><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>`;
}
const pager = (total=128) => `
  <div class="pager"><span>共 <b style="color:#409eff">${total}</b> 条</span><span class="sp"></span>
    ${sel('20 条/页', 96)}
    <span class="pg">‹</span><span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">…</span><span class="pg">7</span><span class="pg">›</span>
  </div>`;

/* ---------------- 侧边菜单（V2.0 信息架构） ---------------- */
const MENU = [
  { t:'首页看板', k:'dashboard' },
  { t:'合同管理', k:'contract' },
  { t:'采购管理', k:'purchase', open:true, ch:[
      { t:'采购申请单', k:'pr' }, { t:'采购单', k:'po' } ]},
  { t:'销售管理', k:'sales', open:true, ch:[
      { t:'销售申请单', k:'sr' }, { t:'销售订单', k:'so' } ]},
  { t:'库存管理', k:'stock', open:true, ch:[
      { t:'入库单', k:'in' }, { t:'出库单', k:'out' },
      { t:'库存明细', k:'balance' }, { t:'盘点单', k:'take' } ]},
  { t:'资料库', k:'master', open:true, ch:[
      { t:'组织架构', k:'org' }, { t:'角色管理', k:'role' }, { t:'账号管理', k:'user' },
      { t:'客户信息', k:'cust' }, { t:'供应商信息', k:'supp' },
      { t:'基础信息', k:'base', open:true, ch2:[
          { t:'商品类型', k:'ptype' }, { t:'物料档案', k:'prod' },
          { t:'计量单位', k:'uom' }, { t:'仓库', k:'wh' } ]},
      { t:'系统管理', k:'system' } ]}
];

function side(active){
  const item = (m, lvl) => {
    const cls = ['wf-mi', lvl===1?'sub':(lvl===2?'sub2':'')].filter(Boolean).join(' ');
    return `<div class="${cls} ${m.k===active?'on':''}"><i class="ico"></i><span>${m.t}</span>`
         + (m.ch||m.ch2 ? '<span class="arw">▾</span>' : '') + `</div>`;
  };
  const html = MENU.map(m => {
    let s = item(m, 0);
    if (m.ch) s += m.ch.map(c => {
      let s2 = item(c, 1);
      if (c.ch2) s2 += c.ch2.map(x => item(x, 2)).join('');
      return s2;
    }).join('');
    return s;
  }).join('');
  return `<aside class="wf-side">
    <div class="wf-brand"><span class="logo"></span>CTMS ERP</div>
    <div class="wf-menu">${html}</div>
  </aside>`;
}

function permGroup(name, items, checked){
  const its = items.map(([code,label,on]) =>
    `<div class="it"><span class="cbx ${on?'on':''}"></span>${label}<span style="color:#c0c4cc;font-size:11px">${code.split('.').pop()}</span></div>`).join('');
  return `<div class="perm-grp">
    <div class="gt"><span class="cbx ${checked?'on':''}"></span>${name}
      <span style="color:#c0c4cc;font-size:11px;font-weight:400">${items.length} 项</span></div>
    <div class="items">${its}</div>
  </div>`;
}

/* =======================================================================
   渲染与交互（仅预览器本身）
   ======================================================================= */
const GROUPS = ['框架与规范','业务页面','库存页面','资料库页面'];
let current = PAGES[0].id;

function renderCat(){
  const cat = document.getElementById('cat');
  cat.innerHTML = GROUPS.map(g => {
    const items = PAGES.filter(p => p.group === g);
    if (!items.length) return '';
    return `<h3>${g}</h3>` + items.map(p =>
      `<a data-id="${p.id}" class="${p.id===current?'on':''}">
         <span>${p.name.split('（')[0]}</span><span class="n" style="margin-left:auto">${p.path}</span></a>`).join('');
  }).join('');
}

function renderPage(id){
  const p = PAGES.find(x => x.id === id) || PAGES[0];
  current = p.id;
  document.getElementById('pg-name').textContent = p.name;
  document.getElementById('pg-path').textContent = p.path;
  document.getElementById('pg-perm').textContent = p.perm === '—' ? '' : '权限：' + p.perm;
  document.getElementById('pg-tips').innerHTML = p.tips.map(t => `<li>${t}</li>`).join('');
  document.getElementById('frame').innerHTML = p.html();
  renderCat();
  fit();
}

function fit(){
  const holder = document.getElementById('holder');
  const frame  = document.getElementById('frame');
  const s = Math.min(1, holder.clientWidth / 1440);
  frame.style.transform = `scale(${s})`;
  holder.style.height = (frame.offsetHeight * s + 2) + 'px';
}

document.getElementById('cat').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  renderPage(a.dataset.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
window.addEventListener('resize', fit);
renderPage(current);
</script>
