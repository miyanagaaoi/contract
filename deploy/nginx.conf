# CTMS Nginx（Linux 容器/主机共用示例）
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ {
        # 附件走应用接口，不直接暴露目录
        return 404;
    }
    # SPA history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
