# CTMS 发布编排：连接**既有** PostgreSQL（不随栈启动数据库）
#
# 适用于已有一台 PostgreSQL（如开发/生产的 192.168.31.27:5444）的场景：
#   cd deploy && CTMS_DB_URL="postgresql+psycopg2://postgres:密码@192.168.31.27:5444/ctms" \
#     docker compose -f docker-compose.external-pg.yml up -d --build
#
# 也可把连接串写进 deploy/.env（compose 会自动读取），避免密码出现在命令行历史里：
#   CTMS_DB_URL=postgresql+psycopg2://postgres:CHANGE_ME@192.168.31.27:5444/ctms
#
# 首次部署的数据迁移（在宿主机或容器内执行一次）：
#   python -m app.tools.migrate_sqlite_to_pg --sqlite app/data/ctms.db --pg-url "$CTMS_DB_URL"
#   python -m app.tools.backfill_subject_v23          # V2.3：回填仓库所属公司与单据签约公司
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CTMS_DB_URL: ${CTMS_DB_URL:-postgresql+psycopg2://postgres:CHANGE_ME@192.168.31.27:5444/ctms}
      CTMS_UPLOAD_DIR: /data/uploads
      CTMS_LOG_DIR: /data/logs
    volumes:
      - ctms_data:/data
    expose:
      - "8000"

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  ctms_data:
